data_root: ~/share/PDEdata
output_dir: outputs/baselines/paper
experiment_mode: paper

pdes:
  - darcy
  - poisson
  - helmholtz
  - nsnonbounded
  - burger
  - reaction_diffusion
  - shallow_water
  - heat
  - wave
  - advection_diffusion
  - steady_heat_conduction

batch_size: 16
epochs: 200
learning_rate: 0.001
train_size: 50000
val_size: 1000
test_size: 1000
train_shards: 5
scalar_param_mode: metadata
sensor_budget_mode: per_time
data_loading_mode: eager
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
seeds: [1]
sensor_counts: [500]
sensor_modes: [random_per_sample, grid, fixed]
noise_levels: [0.0, 0.01, 0.05, 0.10]

method:
  implementation_mode: official_or_skip
  official_backend: auto
  normalize: true
  lr_scheduler: reduce_on_plateau
  scheduler_monitor: val_loss
  scheduler_patience: 5
  scheduler_factor: 0.5
  scheduler_min_lr: 1.0e-5
  scheduler_threshold: 1.0e-6
  early_stopping: true
  early_stopping_patience: 10
  early_stopping_min_delta: 1.0e-4
  min_epochs: 5
  min_optimization_steps: 5
  restore_best: true
  grad_clip_norm: null
  width: 48
  modes1: 16
  modes2: 16
  layers: 4
  hidden: 256
  basis: 128
  steps: 200
  refine_steps: 100
  lambda_obs: 1.0
  lambda_pde: 0.01
  lambda_int: 0.01
  lambda_bc: 0.01
  lambda_ic: 0.01
  physics_loss_mode: total
  lambda_reg: 0.00001

method_by_baseline:
  fno:
    width: 64
    layers: 4
    modes1: 20
    modes2: 20
    optimizer: adamw
    weight_decay: 0.0001
    training_loss: h1
    lr_scheduler: step
    scheduler_step_size: 100
    scheduler_gamma: 0.5
  deeponet:
    hidden: 256
    basis: 128
    optimizer: adam
    training_loss: mse
    lr_scheduler: none
  ifno:
    implementation_mode: official_aligned
    official_backend: ifno
    width: 64
    layers: 4
    modes1: 16
    modes2: 16
    padding: 20
    rank: 24
    training_protocol: official_three_stage
    ifno_pretrain_epochs: 200
    vae_pretrain_epochs: 100
    joint_epochs: 200
    lr_ifno: 0.00025
    lr_vae: 0.001
    lr_forward: 0.00005
    lr_backward: 0.00005
    kl_weight: 0.01
    reconstruction_weight: 1.0
    vae_resolution: 64
    cycle_weight: 0.0
    lr: 0.0005
    vae_grad_clip_norm: 2.0
    ifno_grad_clip_norm: 10.0
    joint_grad_clip_norm: 10.0
    vae_geometric_augmentation: true
    early_stopping_patience: 12
  recfno:
    width: 32
    modes1: 18
    modes2: 18
    input_representation: voronoi_mask_coords
    optimizer: adam
    training_loss: l1
    lr_scheduler: exponential
    scheduler_gamma: 0.98
  senseiver:
    batch_pixels: 2048
    space_bands: 32
    enc_preproc_ch: 64
    num_latents: 4
    enc_num_latent_channels: 16
    num_layers: 3
    num_cross_attention_heads: 2
    enc_num_self_attention_heads: 2
    num_self_attention_layers_per_block: 3
    dec_preproc_ch: null
    dec_num_latent_channels: 16
    dec_num_cross_attention_heads: 1
    lr: 0.0001
    optimizer: adam
    training_loss: sum_mse
    lr_scheduler: none
    scheduler_monitor: train_loss
    early_stopping_patience: 100
  voronoicnn:
    implementation_mode: official_architecture
    official_backend: voronoicnn
    width: 48
    optimizer: adam
    training_loss: mse
    lr_scheduler: none
    early_stopping_patience: 100
  pinn_sparse:
    normalize: false
    implementation_mode: official_aligned
    official_backend: deepxde
    deepxde_native: true
    hidden: 128
    depth: 5
    steps: 1000
    adam_iterations: 1000
    lbfgs_steps: 500
    num_domain: 4096
    num_boundary: 512
    activation: tanh
    kernel_initializer: Glorot normal
    lr: 0.001
    lambda_int: 1.0
    lambda_bc: 1.0
    lambda_obs: 1.0
  pc_bnn:
    normalize: false
    implementation_mode: official_aligned
    official_backend: pc_bnn
    hidden: 20
    depth: 3
    particles: 5
    steps: 2000
    lr: 0.001
    lr_noise: 0.00001
    beta_prior_shape: 2.0
    beta_prior_rate: 1.0e-6
    weight_prior_shape: 1.0
    weight_prior_rate: 0.05
    equation_variance: 0.0001
    lambda_int: 1.0
    lambda_bc: 1.0
    lambda_ic: 1.0
  pde_opt:
    normalize: false
    steps: 500
    lr: 0.01
    lambda_reg: 0.00001
  var4d:
    normalize: false
    steps: 500
    lr: 0.01
    lambda_background: 0.1
    lambda_obs: 1.0
  vivid:
    normalize: true
    implementation_mode: official_aligned
    official_backend: vivid
    train_inverse_operator: true
    uses_official_inverse_observation_operator: true
    refine_steps: 300
    lr: 0.005
    lambda_inverse_operator: 0.25
    lambda_background: 0.05

method_by_pde:
  heat:
    lambda_int: 0.01
  wave:
    lambda_int: 0.01
  advection_diffusion:
    lambda_int: 0.01
  steady_heat_conduction:
    lambda_int: 0.01

method_by_baseline_and_pde:
  ifno:
    nsnonbounded:
      ifno_grad_clip_norm: 2.0
      joint_grad_clip_norm: 2.0
