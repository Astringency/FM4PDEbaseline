name: runtime_budget_ablation
experiment_kind: ablation
ablation_factor: runtime_budget
config: baselines/configs/paper.yaml
data_files_config: configs/data_files/formal_128.yaml
pdes: [poisson, nsnonbounded]
baselines: [pinn_sparse, pc_bnn, pde_opt, var4d, vivid]
seeds: [1]
train_size: 50000
val_size: 1000
test_size: 1000
train_shards: 5
num_sensors: 500
sensor_mode: random_per_sample
noise_level: 0.0
data_loading_mode: eager
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
device: cuda
task_groups:
  - runtime_budget_sparse_forward
  - runtime_budget_pcbnn
  - runtime_budget_time_varying_da
task_group_overrides:
  runtime_budget_sparse_forward:
    task: sparse_forward
    pdes: [poisson]
    baselines: [pinn_sparse, pde_opt]
    budget_by_baseline:
      pinn_sparse:
        steps: [50, 100, 250, 500, 1000]
      pde_opt:
        steps: [50, 100, 250, 500, 1000]
  runtime_budget_pcbnn:
    task: sparse_forward
    pdes: [poisson]
    baselines: [pc_bnn]
    budget_by_baseline:
      pc_bnn:
        steps: [50, 100, 250, 500, 1000]
        particles: 8
  runtime_budget_time_varying_da:
    task: sparse_solution
    pdes: [nsnonbounded]
    baselines: [var4d, vivid]
    sensor_mode: time_varying
    load_full_trajectory: true
    budget_by_baseline:
      var4d:
        steps: [50, 100, 250, 500, 1000]
      vivid:
        refine_steps: [50, 100, 250, 500]
resources:
  amortized_default:
    batch_size: 16
    epochs: 200
    device: cuda
  per_instance_default:
    batch_size: 1
    epochs: 1
    device: cuda
  pinn_sparse:
    batch_size: 1
    steps: 1000
  pc_bnn:
    batch_size: 1
    particles: 8
    steps: 500
  pde_opt:
    batch_size: 1
    steps: 500
  var4d:
    batch_size: 1
    steps: 500
    load_full_trajectory: true
  vivid:
    batch_size: 1
    refine_steps: 300
    load_full_trajectory: true
