legacy: true
description: "Exhaustive grid retained for debugging only; not used by default paper experiments."
name: time_varying
experiment_kind: ablation
ablation_factor: time_varying_sensor_count
allow_multi_factor_grid: true
config: baselines/configs/paper.yaml
pdes: [nsnonbounded, burger, reaction_diffusion, shallow_water]
seeds: [1, 2, 3]
train_size: 50000
val_size: 0
test_size: 1000
train_shards: 5
sensor_counts: [50, 100, 250, 500]
sensor_modes: [time_varying]
noise_levels: [0.0, 0.01, 0.05]
data_loading_mode: lazy
device: cuda
load_full_trajectory: true
task_groups:
  - time_varying
task_group_overrides:
  time_varying:
    pdes: [nsnonbounded, burger, reaction_diffusion, shallow_water]
    baselines: [var4d, vivid, senseiver]
    extra_skip_baselines: [recfno, voronoicnn, fno, deeponet]
    sensor_counts: [50, 100, 250, 500]
    sensor_modes: [time_varying]
    noise_levels: [0.0, 0.01, 0.05]
    load_full_trajectory: true
resources:
  amortized_default:
    batch_size: 16
    epochs: 200
    device: cuda
  per_instance_default:
    batch_size: 1
    epochs: 1
    device: cuda
  var4d:
    batch_size: 1
    steps: 500
    load_full_trajectory: true
  vivid:
    batch_size: 1
    refine_steps: 300
    load_full_trajectory: true
