legacy: true
description: "Exhaustive grid retained for debugging only; not used by default paper experiments."
name: full_all
experiment_kind: ablation
ablation_factor: sensor_count
allow_multi_factor_grid: true
config: baselines/configs/paper.yaml
pdes:
  - darcy
  - poisson
  - helmholtz
  - nsnonbounded
  - burger
  - reaction_diffusion
  - shallow_water
  - heat
  - wave
  - advection_diffusion
  - steady_heat_conduction
seeds: [1, 2, 3]
train_size: 50000
val_size: 0
test_size: 1000
train_shards: 5
sensor_counts: [25, 50, 100, 250, 500, 1000]
sensor_modes: [random, fixed, grid]
noise_levels: [0.0, 0.01, 0.05, 0.10]
data_loading_mode: lazy
device: cuda
task_groups:
  - full_forward
  - full_inverse
  - sparse_solution_amortized
  - sparse_solution_physics
  - sparse_inverse
  - time_varying
task_group_overrides:
  time_varying:
    pdes: [nsnonbounded, burger, reaction_diffusion, shallow_water]
    baselines: [var4d, vivid, senseiver]
    extra_skip_baselines: [recfno, voronoicnn, fno, deeponet]
    sensor_counts: [50, 100, 250, 500]
    sensor_modes: [time_varying]
    noise_levels: [0.0, 0.01, 0.05]
    load_full_trajectory: true
resources:
  amortized_default:
    batch_size: 16
    epochs: 200
    device: cuda
  per_instance_default:
    batch_size: 1
    epochs: 1
    device: cuda
  pinn_sparse:
    batch_size: 1
    steps: 1000
  pc_bnn:
    batch_size: 1
    particles: 8
    steps: 500
  pde_opt:
    batch_size: 1
    steps: 500
  var4d:
    batch_size: 1
    steps: 500
    load_full_trajectory: true
  vivid:
    batch_size: 1
    refine_steps: 300
    load_full_trajectory: true
