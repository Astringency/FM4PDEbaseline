name: core
config: baselines/configs/paper.yaml
pdes:
  - darcy
  - poisson
  - helmholtz
  - nsnonbounded
  - burger
  - reaction_diffusion
  - shallow_water
  - heat
  - wave
  - advection_diffusion
  - steady_heat_conduction
seeds: [1, 2, 3]
train_size: 50000
val_size: 0
test_size: 1000
train_shards: 5
sensor_counts: [50, 100, 250, 500, 1000]
sensor_modes: [random, fixed, grid]
noise_levels: [0.0, 0.01, 0.05]
data_loading_mode: lazy
device: cuda
task_groups:
  - full_forward
  - full_inverse
  - sparse_solution_amortized
  - sparse_solution_physics
  - sparse_inverse
resources:
  amortized_default:
    batch_size: 16
    epochs: 200
    device: cuda
  per_instance_default:
    batch_size: 1
    epochs: 1
    device: cuda
  pinn_sparse:
    batch_size: 1
    steps: 1000
  pc_bnn:
    batch_size: 1
    particles: 8
    steps: 500
  pde_opt:
    batch_size: 1
    steps: 500
  var4d:
    batch_size: 1
    steps: 500
    load_full_trajectory: true
  vivid:
    batch_size: 1
    refine_steps: 300
    load_full_trajectory: true
