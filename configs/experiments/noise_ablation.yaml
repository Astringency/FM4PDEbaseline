name: noise_ablation
experiment_kind: ablation
ablation_factor: noise_level
config: baselines/configs/paper.yaml
pdes:
  - poisson
  - helmholtz
  - darcy
  - burger
  - nsnonbounded
baselines: [recfno, senseiver, voronoicnn]
seeds: [1]
train_size: 50000
val_size: 1000
test_size: 1000
train_shards: 5
num_sensors: 500
sensor_mode: random_per_sample
sensor_budget_mode: total
noise_levels: [0.0, 0.01, 0.05, 0.10]
data_loading_mode: eager
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
device: cuda
task_groups: [noise_ablation]
resources:
  amortized_default:
    batch_size: 16
    epochs: 200
    device: cuda
  per_instance_default:
    batch_size: 1
    epochs: 1
    device: cuda
  pinn_sparse:
    batch_size: 1
    steps: 1000
  pde_opt:
    batch_size: 1
    steps: 500
