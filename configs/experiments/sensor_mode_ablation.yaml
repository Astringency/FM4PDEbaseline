name: sensor_mode_ablation
experiment_kind: ablation
ablation_factor: sensor_mode
config: baselines/configs/paper.yaml
pdes:
  - darcy
  - poisson
  - nsnonbounded
  - reaction_diffusion
  - shallow_water
  - heat
baselines: [recfno, senseiver, voronoicnn, pde_opt]
seeds: [1, 2, 3]
train_size: 50000
val_size: 0
test_size: 1000
train_shards: 5
num_sensors: 500
sensor_modes: [random, fixed, grid]
noise_level: 0.0
data_loading_mode: eager
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
device: cuda
task_groups: [sensor_mode_ablation]
resources:
  amortized_default:
    batch_size: 16
    epochs: 200
    device: cuda
  per_instance_default:
    batch_size: 1
    epochs: 1
    device: cuda
  pde_opt:
    batch_size: 1
    steps: 500
