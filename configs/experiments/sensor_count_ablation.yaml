name: sensor_count_ablation
experiment_kind: ablation
ablation_factor: sensor_count
config: baselines/configs/paper.yaml
pdes:
  - darcy
  - poisson
  - nsnonbounded
  - reaction_diffusion
  - shallow_water
  - heat
  - advection_diffusion
baselines: [recfno, senseiver, voronoicnn, pinn_sparse, pde_opt]
seeds: [1, 2, 3]
train_size: 50000
val_size: 0
test_size: 10000
train_shards: 5
sensor_counts: [25, 50, 100, 250, 500, 1000]
sensor_mode: random_per_sample
noise_level: 0.0
data_loading_mode: eager
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
device: cuda
task_groups: [sensor_count_ablation]
resources:
  amortized_default:
    batch_size: 16
    epochs: 200
    device: cuda
  per_instance_default:
    batch_size: 1
    epochs: 1
    device: cuda
  pinn_sparse:
    batch_size: 1
    steps: 1000
  pde_opt:
    batch_size: 1
    steps: 500
