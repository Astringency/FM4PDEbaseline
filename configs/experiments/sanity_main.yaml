name: sanity_main
experiment_kind: main
config: baselines/configs/paper.yaml
data_files_config: configs/data_files/formal_128.yaml
pdes: [poisson, helmholtz, darcy, burger, nsnonbounded]
seeds: [1]
train_size: 128
val_size: 16
test_size: 16
train_shards: 5
data_loading_mode: eager
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
device: cuda
task_groups:
  - full_forward_main
  - full_inverse_main
  - sparse_solution_main_amortized
  - sparse_inverse_main
task_group_overrides:
  full_forward_main:
    pdes: [poisson, helmholtz]
    baselines: [fno, ifno]
    num_sensors: 0
    sensor_mode: none
    noise_level: 0.0
  full_inverse_main:
    pdes: [poisson, helmholtz]
    baselines: [ifno]
    num_sensors: 0
    sensor_mode: none
    noise_level: 0.0
  sparse_solution_main_amortized:
    pdes: [darcy, nsnonbounded]
    baselines: [recfno, senseiver]
    num_sensors: 50
    sensor_mode: random_per_sample
    noise_level: 0.0
  sparse_inverse_main:
    pdes: [darcy, poisson]
    baselines: [pde_opt, pinn_sparse]
    num_sensors: 50
    sensor_mode: random_per_sample
    noise_level: 0.0
resources:
  amortized_default:
    batch_size: 16
    epochs: 1
    device: cuda
  per_instance_default:
    batch_size: 1
    epochs: 1
    device: cuda
  pinn_sparse:
    batch_size: 1
    steps: 2
  pc_bnn:
    batch_size: 1
    particles: 2
    steps: 2
  pde_opt:
    batch_size: 1
    steps: 2
