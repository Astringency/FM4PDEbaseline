name: sanity_main
experiment_kind: main
main_table_only: true
config: baselines/configs/paper.yaml
pdes: [darcy, poisson, nsnonbounded, reaction_diffusion, shallow_water, heat]
seeds: [1]
train_size: 128
val_size: 0
test_size: 16
train_shards: 5
data_loading_mode: lazy
device: cuda
task_groups:
  - full_forward_main
  - full_inverse_main
  - sparse_solution_main_amortized
  - sparse_solution_main_physics
  - sparse_inverse_main
task_group_overrides:
  full_forward_main:
    pdes: [darcy, heat]
    baselines: [fno]
    num_sensors: 0
    sensor_mode: none
    noise_level: 0.0
  full_inverse_main:
    pdes: [poisson, heat]
    baselines: [ifno]
    num_sensors: 0
    sensor_mode: none
    noise_level: 0.0
  sparse_solution_main_amortized:
    pdes: [darcy, reaction_diffusion]
    baselines: [recfno, senseiver]
    num_sensors: 50
    sensor_mode: random
    noise_level: 0.0
  sparse_solution_main_physics:
    pdes: [poisson, shallow_water]
    baselines: [pde_opt, pinn_sparse]
    num_sensors: 50
    sensor_mode: random
    noise_level: 0.0
  sparse_inverse_main:
    pdes: [darcy, poisson]
    baselines: [pde_opt, pinn_sparse]
    num_sensors: 50
    sensor_mode: random
    noise_level: 0.0
resources:
  amortized_default:
    batch_size: 16
    epochs: 1
    device: cuda
  per_instance_default:
    batch_size: 1
    epochs: 1
    device: cuda
  pinn_sparse:
    batch_size: 1
    steps: 2
  pc_bnn:
    batch_size: 1
    particles: 2
    steps: 2
  pde_opt:
    batch_size: 1
    steps: 2
  var4d:
    batch_size: 1
    steps: 2
    load_full_trajectory: true
  vivid:
    batch_size: 1
    refine_steps: 2
    load_full_trajectory: true
