name: main_results
experiment_kind: main
main_table_only: true
config: baselines/configs/paper.yaml
pdes:
  - darcy
  - poisson
  - helmholtz
  - nsnonbounded
  - burger
  - reaction_diffusion
  - shallow_water
  - heat
  - wave
  - advection_diffusion
  - steady_heat_conduction
seeds: [1, 2, 3]
train_size: 50000
val_size: 1000
test_size: 1000
train_shards: 5
data_loading_mode: eager
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
device: cuda
task_groups:
  - full_forward_main
  - full_inverse_main
  - sparse_solution_main_amortized
  - sparse_solution_main_physics
  - sparse_inverse_main
  - time_varying_da_main
task_group_overrides:
  full_forward_main:
    task: forward
    baselines: [fno, deeponet, ifno]
    num_sensors: 0
    sensor_mode: none
    noise_level: 0.0
  full_inverse_main:
    task: inverse
    baselines: [fno, deeponet, ifno]
    num_sensors: 0
    sensor_mode: none
    noise_level: 0.0
  sparse_solution_main_amortized:
    task: sparse_solution
    baselines: [recfno, senseiver, voronoicnn]
    num_sensors: 500
    sensor_mode: random
    noise_level: 0.0
  sparse_solution_main_physics:
    task: sparse_solution
    baselines: [pinn_sparse, pc_bnn, pde_opt]
    num_sensors: 500
    sensor_mode: random
    noise_level: 0.0
  sparse_inverse_main:
    task: sparse_inverse
    baselines: [pinn_sparse, pde_opt]
    num_sensors: 500
    sensor_mode: random
    noise_level: 0.0
  time_varying_da_main:
    task: sparse_solution
    pdes: [nsnonbounded, burger, reaction_diffusion, shallow_water]
    baselines: [senseiver, var4d, vivid]
    num_sensors: 500
    sensor_mode: time_varying
    noise_level: 0.0
    load_full_trajectory: true
resources:
  amortized_default:
    batch_size: 16
    epochs: 200
    device: cuda
  per_instance_default:
    batch_size: 1
    epochs: 1
    device: cuda
  pinn_sparse:
    batch_size: 1
    steps: 1000
  pc_bnn:
    batch_size: 1
    particles: 8
    steps: 500
  pde_opt:
    batch_size: 1
    steps: 500
  var4d:
    batch_size: 1
    steps: 500
    load_full_trajectory: true
  vivid:
    batch_size: 1
    refine_steps: 300
    load_full_trajectory: true
