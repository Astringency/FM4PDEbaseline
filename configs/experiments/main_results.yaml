name: main_results
experiment_kind: main
comparison_track: unified_adapted
config: baselines/configs/paper.yaml
data_files_config: configs/data_files/formal_128.yaml
task_protocol_version: fm4pde-task-contract-v3
sensor_protocol_version: fm4pde-sensor-contract-v3
pdes: [poisson, helmholtz, darcy, burger, nsnonbounded]
seeds: [1]
# train_size is the shared train/validation pool. With no explicit val files,
# the final val_size samples are reserved for validation (49,000 + 1,000 here).
train_size: 50000
val_size: 5000
test_size: 1000
train_shards: 5
data_loading_mode: eager
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
device: cuda
task_groups:
  - full_forward_main
  - full_inverse_main
  - sparse_inverse_main_amortized
  - sparse_inverse_main
  - sparse_solution_main_amortized
  - sparse_solution_burger_time_slices
  - sparse_forward_main_amortized
  - sparse_forward_main_physics
task_group_overrides:
  full_forward_main:
    task: forward
    pdes: [poisson, helmholtz, darcy, nsnonbounded]
    baselines: [fno, deeponet, ifno]
    num_sensors: 0
    sensor_mode: none
    noise_level: 0.0
  full_inverse_main:
    task: inverse
    pdes: [poisson, helmholtz, darcy, nsnonbounded]
    baselines: [ifno]
    num_sensors: 0
    sensor_mode: none
    noise_level: 0.0
  sparse_inverse_main_amortized:
    task: sparse_inverse
    pdes: [poisson, helmholtz, darcy, nsnonbounded]
    baselines: [recfno, senseiver, voronoicnn]
    num_sensors: 500
    sensor_mode: random_per_sample
    noise_level: 0.0
  sparse_inverse_main:
    task: sparse_inverse
    pdes: [poisson, helmholtz, darcy]
    baselines: [pinn_sparse, pde_opt, pc_bnn]
    num_sensors: 500
    sensor_mode: random_per_sample
    noise_level: 0.0
  sparse_solution_main_amortized:
    task: sparse_solution
    baselines: [recfno, senseiver, voronoicnn]
    num_sensors: 500
    sensor_mode: random_per_sample
    sensor_budget_mode: total
    noise_level: 0.0
    load_full_trajectory: true
  sparse_solution_burger_time_slices:
    task: sparse_solution
    pdes: [burger]
    baselines: [recfno, senseiver, voronoicnn]
    num_sensors: 5
    sensor_mode: time_slices_per_sample
    sensor_budget_mode: total
    noise_level: 0.0
    load_full_trajectory: true
  sparse_forward_main_amortized:
    task: sparse_forward
    pdes: [poisson, helmholtz, darcy, nsnonbounded]
    baselines: [recfno, senseiver, voronoicnn]
    num_sensors: 500
    sensor_mode: random_per_sample
    noise_level: 0.0
  sparse_forward_main_physics:
    task: sparse_forward
    pdes: [poisson, helmholtz, darcy]
    baselines: [pinn_sparse, pde_opt, pc_bnn]
    num_sensors: 500
    sensor_mode: random_per_sample
    noise_level: 0.0
resources:
  amortized_default:
    batch_size: 16
    epochs: 200
    device: cuda
  per_instance_default:
    batch_size: 1
    epochs: 1
    device: cuda
  ifno:
    batch_size: 16
    epochs: 500
  pinn_sparse:
    batch_size: 1
    steps: 1000
  pc_bnn:
    batch_size: 1
    particles: 5
    steps: 2000
  pde_opt:
    batch_size: 1
    steps: 500
