name: train_size_ablation
experiment_kind: ablation
ablation_factor: train_size
config: baselines/configs/paper.yaml
data_files_config: configs/data_files/formal_128.yaml
pdes:
  - poisson
  - helmholtz
  - darcy
  - burger
  - nsnonbounded
baselines: [recfno, senseiver, voronoicnn]
seeds: [1]
# train_size is the shared pool; these values preserve effective fit sizes
# of 5k, 10k, 20k, 30k, and 45k after reserving the validation tail.
train_sizes: [10000, 15000, 25000, 35000, 50000]
val_size: 5000
test_size: 1000
train_shards: 5
num_sensors: 500
sensor_mode: random_per_sample
sensor_budget_mode: total
noise_level: 0.0
data_loading_mode: eager
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
device: cuda
task_groups: [train_size_ablation]
resources:
  amortized_default:
    batch_size: 16
    epochs: 200
    device: cuda
  per_instance_default:
    batch_size: 1
    epochs: 1
    device: cuda
