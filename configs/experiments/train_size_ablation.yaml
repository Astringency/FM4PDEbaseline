name: train_size_ablation
experiment_kind: ablation
ablation_factor: train_size
config: baselines/configs/paper.yaml
pdes:
  - poisson
  - helmholtz
  - darcy
  - burger
  - nsnonbounded
baselines: [recfno, senseiver, voronoicnn]
seeds: [1]
train_sizes: [5000, 10000, 20000, 30000, 50000]
val_size: 1000
test_size: 1000
train_shards: 5
num_sensors: 500
sensor_mode: random_per_sample
sensor_budget_mode: total
noise_level: 0.0
data_loading_mode: eager
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
device: cuda
task_groups: [train_size_ablation]
resources:
  amortized_default:
    batch_size: 16
    epochs: 200
    device: cuda
  per_instance_default:
    batch_size: 1
    epochs: 1
    device: cuda
